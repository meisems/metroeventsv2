<div class="sidebar-brand">
  <div class="sidebar-brand-icon">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#161c30" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  </div>
  <div class="sidebar-brand-text">
    <div class="sidebar-brand-name">Metro Events</div>
    <div class="sidebar-brand-tag">Client Portal</div>
  </div>
</div>

<div class="sidebar-user">
  <div class="sidebar-avatar">{{ current_user.name[0].upper() }}</div>
  <div>
    <div class="sidebar-user-name">{{ current_user.name }}</div>
    <div class="sidebar-user-email">{{ current_user.email }}</div>
  </div>
</div>

<nav class="sidebar-nav">
  <div class="sidebar-nav-label">Navigation</div>

  <a href="{{ url_for('portal.home') }}"
     class="sidebar-link {% if request.endpoint == 'portal.home' or request.endpoint == 'portal.event_overview' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    My Events
  </a>

  <a href="{{ url_for('portal.inquire') }}"
     class="sidebar-link {% if request.endpoint == 'portal.inquire' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    Inquire
  </a>

  <a href="{{ url_for('portal.request_change') }}"
     class="sidebar-link {% if request.endpoint == 'portal.request_change' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
    Request Change
  </a>

  <a href="{{ url_for('portal.review') }}"
     class="sidebar-link {% if request.endpoint == 'portal.review' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Review
  </a>

  <a href="{{ url_for('portal.profile') }}"
     class="sidebar-link {% if request.endpoint == 'portal.profile' %}active{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    Profile
  </a>
</nav>

<div class="sidebar-footer">
  <a href="{{ url_for('client_auth.logout') }}" class="sidebar-logout">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Sign Out
  </a>
</div>
