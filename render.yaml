# render.yaml — Infrastructure-as-code for Render
# Docs: https://render.com/docs/blueprint-spec
#
# Deploys metro-events-admin as a Render Web Service.
# The app is built with Vite and served via `vite preview`.

services:
  - type: web
    name: metro-events-admin
    runtime: node
    region: singapore       # change to your preferred region
    plan: free              # upgrade to starter/standard for production
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false         # set manually in Render dashboard — never commit secrets
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "20"
